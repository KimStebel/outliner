# Rauthy for local development.
#
# Production gets its own service in ../docker-compose.yml. This one exists so
# the login flow can be exercised without deploying, and is deliberately the
# same shape: same config.toml, same bootstrap data, Rauthy mounted under
# /auth on the app's own origin.
#
# Vite proxies /auth to 127.0.0.1:8081 (see vite.config.ts), so the browser
# only ever talks to http://localhost:8080 and everything is same-origin —
# which is what makes the issuer, the cookies and the CSP behave as they will
# in production.
#
# The secrets below are local-only throwaways, committed on purpose so the
# setup is reproducible. They protect a plain-HTTP database on localhost
# containing one fake user. Production generates its own; see deploy.sh.

services:
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.1
    container_name: outliner-rauthy-local
    restart: unless-stopped
    ports:
      # Localhost only: this is a dev identity provider with a known password.
      - '127.0.0.1:8081:8080'
    volumes:
      - ./config.toml:/app/config.toml:ro
      # Generated by rauthy-local.sh from the committed ./bootstrap, plus the
      # local user and a short-lived client for testing refreshes. Mounted at
      # the path config.toml names, so only the host side differs.
      #
      # Applied on first start only — bootstrap is a plain INSERT with no
      # upsert, so editing these files does nothing to a database that already
      # exists. Use ./rauthy-local.sh --reset to start over.
      - ./bootstrap-local:/app/bootstrap:ro
      - rauthy-local-data:/app/data
    environment:
      # The origin the *browser* uses, not the port Rauthy listens on. The
      # issuer is derived from this as `<scheme>://<pub_url>/auth/v1/`.
      PUB_URL: localhost:8080
      # Must stay false locally. `proxy_mode` forces the issuer scheme to
      # https regardless of `scheme`, which would make it disagree with the
      # http origin the browser actually used and fail validation.
      PROXY_MODE: 'false'
      # Over plain http, a Secure cookie would never be sent back.
      COOKIE_MODE: danger-insecure
      RP_ID: localhost
      RP_ORIGIN: http://localhost:8080

      ENC_KEYS: 4rpwODJv/d1pQWiOCFvMlge5qOEfxw4W1FqL9uXCIsP8TzW7VRCw=
      ENC_KEY_ACTIVE: 4rpwODJv
      HQL_SECRET_RAFT: aZVVLoHpUiHrTYE7FWGLGumD60NaSt0b
      HQL_SECRET_API: QhPtEQHOTpkVln4WKwUHB0vkIS901eVv

      # Rauthy's own admin, separate from the app's user: the admin UI defaults
      # to requiring MFA, which the app's password login should not.
      BOOTSTRAP_ADMIN_EMAIL: admin@localhost
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: LocalAdminPassword123!
    # No healthcheck: the image is distroless, so it has no shell and no curl,
    # and Rauthy's CLI has no healthcheck subcommand. rauthy-local.sh polls
    # /auth/v1/health from the host instead, which tests the proxy path too.

volumes:
  rauthy-local-data:
