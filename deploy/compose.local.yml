# The whole stack locally, shaped exactly as production.
#
# Same Caddyfile, same backend image, same Rauthy image and config, same
# routes: everything is reached through Caddy on one origin, and the backend
# and the identity provider are unpublished. The only differences are the site
# address (plain HTTP on :8080 rather than a hostname with a certificate), the
# secrets, and the bootstrap data.
#
# Started by ./stack-local.sh, which builds the site and generates the bits
# that are not committed.
#
# Use this to check anything that involves the proxy — the auth rules, the
# headers, the service worker, compression and ETags. For editing the app
# itself, the Vite dev server with ./rauthy/rauthy-local.sh is a faster loop.

services:
  caddy:
    image: caddy:2-alpine
    container_name: outliner-caddy-local
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Any host on :8080, over plain HTTP. Production names a hostname here,
      # which is what makes Caddy fetch a certificate for it.
      SITE_ADDRESS: ':8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      # The built site, as rsynced to ./site in production.
      - ../dist:/srv:ro
      - caddy-data-local:/data
      - caddy-config-local:/config
    depends_on:
      - backend
      - rauthy

  backend:
    build: ../backend
    container_name: outliner-backend-local
    restart: unless-stopped
    # Deliberately no `ports:`, as in production. Reaching it directly would
    # skip both Caddy's basic auth and nothing else — the bearer check below
    # happens in the service — but the point is to test the real path.
    volumes:
      # A named volume rather than a bind mount: the service runs as uid
      # 10001, and a host directory would need chowning to match.
      - backend-data-local:/data
    environment:
      DATA_DIR: /data
      BIND: 0.0.0.0:8080
      # Exactly as Rauthy advertises it, trailing slash included. Getting this
      # wrong rejects every token, so it is worth comparing against
      # /auth/v1/.well-known/openid-configuration rather than typing it twice.
      AUTH_ISSUER: http://localhost:8080/auth/v1/
      # Reached by service name over the container network, so no TLS is
      # involved. This is a different address from the issuer on purpose.
      AUTH_JWKS_URL: http://rauthy:8080/auth/v1/oidc/certs
      AUTH_AUDIENCE: outliner
      # Authentication is not authorisation: only this subject may touch the
      # document, however valid someone else's token is.
      AUTH_SUBJECTS: outlinerkimstebel0000001

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.1
    container_name: outliner-rauthy-local
    restart: unless-stopped
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      # Generated by ./rauthy/make-bootstrap-local.sh. Applied on first start
      # only — bootstrap is a plain INSERT with no upsert — so use
      # ./stack-local.sh --reset after changing it.
      - ./rauthy/bootstrap-local:/app/bootstrap:ro
      - rauthy-data-local:/app/data
    environment:
      # The origin the *browser* uses, not the port anything listens on. The
      # issuer is derived from this as `<scheme>://<pub_url>/auth/v1/`.
      PUB_URL: localhost:8080
      # Must stay false locally even though Caddy really is in front:
      # `proxy_mode` forces the issuer scheme to https, which would then
      # disagree with the http origin the browser actually used.
      PROXY_MODE: 'false'
      # Over plain http, a Secure cookie would never come back.
      COOKIE_MODE: danger-insecure
      RP_ID: localhost
      RP_ORIGIN: http://localhost:8080

      # Local-only throwaways, committed on purpose so the setup is
      # reproducible. They protect a plain-HTTP database on localhost holding
      # one fake user. Production generates its own.
      ENC_KEYS: 4rpwODJv/d1pQWiOCFvMlge5qOEfxw4W1FqL9uXCIsP8TzW7VRCw=
      ENC_KEY_ACTIVE: 4rpwODJv
      HQL_SECRET_RAFT: aZVVLoHpUiHrTYE7FWGLGumD60NaSt0b
      HQL_SECRET_API: QhPtEQHOTpkVln4WKwUHB0vkIS901eVv

      # Must match ./rauthy/local-user.env.
      BOOTSTRAP_ADMIN_EMAIL: admin@localhost
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: LocalAdminPassword123!

volumes:
  caddy-data-local:
  caddy-config-local:
  backend-data-local:
  rauthy-data-local:
