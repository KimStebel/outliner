# Caddy fronting the built static site, with certificates it obtains and
# renews itself.
#
# The build is done on the developer's machine and rsynced into ./site, so the
# server needs no Node toolchain and a deploy is just a file copy.

services:
  caddy:
    image: caddy:2-alpine
    container_name: outliner-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      # Certificates live here. Losing this volume means re-issuing on every
      # restart, which runs into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
