# Caddy terminates TLS, serves the built static site, and proxies the sync API
# and the identity provider.
#
# The frontend is built on the developer's machine and rsynced into ./site, so
# the server needs no Node toolchain. The backend is built here from ./backend.
#
# Rauthy is mounted at /auth on this same origin, which is why there is no
# second certificate or DNS record for it.
#
# Both the backend and Rauthy are unpublished: Caddy is the only way in. The
# backend in particular would hand over the document to anyone who reached it
# without a bearer token, because it trusts the proxy to have authenticated
# anything that arrives without one.

# Named explicitly: the local stack's compose file sits in this same
# directory, so without this they would share a project name derived from it
# and compose commands for one would see the other's containers.
name: outliner

services:
  caddy:
    image: caddy:2-alpine
    container_name: outliner-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    environment:
      # The Caddyfile is shared with the local stack, which runs on a port
      # rather than a hostname. Naming the host here is what makes Caddy get a
      # certificate for it.
      SITE_ADDRESS: outliner.stebel.kim
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      # Certificates live here. Losing this volume means re-issuing on every
      # restart, which runs into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - rauthy
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: outliner-backend
    restart: unless-stopped
    # Deliberately no `ports:`. The service has no authentication of its own —
    # Caddy is the only way in, and publishing this would publish the document.
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      BIND: 0.0.0.0:8080
      # Exactly as Rauthy advertises it, trailing slash included. The
      # deployment check compares this against the live discovery document,
      # because getting it wrong refuses every token and is otherwise
      # invisible until a client tries to sync.
      AUTH_ISSUER: https://outliner.stebel.kim/auth/v1/
      # By service name over the container network, so no TLS is involved.
      # Deliberately a different address from the issuer.
      AUTH_JWKS_URL: http://rauthy:8080/auth/v1/oidc/certs
      AUTH_AUDIENCE: outliner
      # Every account gets a document of its own. This names the owner of the
      # one document from before that, still at the top of ./data, so the
      # first start moves it into their directory. Harmless once it has.
      LEGACY_OWNER: outlinerkimstebel0000001

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.1
    container_name: outliner-rauthy
    restart: unless-stopped
    # Deliberately no `ports:`, as with the backend.
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      # Clients and the single user. Applied on first start only — bootstrap
      # is a plain INSERT with no upsert — so later changes have to go through
      # the admin UI.
      - ./rauthy/bootstrap:/app/bootstrap:ro
      # Holds the user account and the signing keys. Worth backing up: losing
      # it means re-creating the account, and every issued token stops
      # verifying.
      - rauthy-data:/app/data
    environment:
      PUB_URL: outliner.stebel.kim
      # True here, unlike locally: Caddy terminates TLS, and this is what
      # makes the issuer https and lets Rauthy see the real client address.
      PROXY_MODE: 'true'
      # Mandatory with proxy_mode, and must cover Caddy's address on the
      # compose network, or every request is refused as possibly spoofed.
      TRUSTED_PROXIES: 172.16.0.0/12
      # Not `host`: the app shares this origin, so the cookie is scoped to
      # /auth instead. Rauthy's own documentation recommends this for exactly
      # this arrangement.
      COOKIE_MODE: secure
      # Its own daily backup, pushed to R2. A real SQLite snapshot rather than
      # a copy of a live file, encrypted with ENC_KEYS, and integrity-checked
      # on restore — which is why this is left to Rauthy rather than being
      # bundled into backup-doc.sh.
      HQL_BACKUP_CRON: '0 30 2 * * * *'
      HQL_BACKUP_KEEP_FOR: 10d
      RP_ID: outliner.stebel.kim
      # The port is not optional. Rauthy splits this on the last colon and
      # parses what follows as a port number, so without one it reads
      # "//outliner.stebel.kim" as the port and refuses to start.
      RP_ORIGIN: https://outliner.stebel.kim:443
    # Copied here from prod-rauthy-env by the deploy script, so this compose
    # file works unchanged on both sides and the configuration can be
    # validated locally before being shipped. Generated on first run and then
    # left alone: regenerating the encryption keys would make the existing
    # database unreadable. Not committed.
    env_file:
      - ./rauthy.env
      # The R2 credentials, as HQL_S3_*. Shared with backup-doc.sh, which
      # sources the same file, so the credentials live in one place.
      - ./r2.env

volumes:
  caddy-data:
  caddy-config:
  rauthy-data:
