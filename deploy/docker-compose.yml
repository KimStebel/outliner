# Caddy terminates TLS, serves the built static site, and enforces basic auth
# in front of the sync service.
#
# The frontend is built on the developer's machine and rsynced into ./site, so
# the server needs no Node toolchain. The backend is built here from ./backend.

services:
  caddy:
    image: caddy:2-alpine
    container_name: outliner-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The basic_auth block, generated by the deploy script. Not committed.
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - ./site:/srv:ro
      # Certificates live here. Losing this volume means re-issuing on every
      # restart, which runs into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: outliner-backend
    restart: unless-stopped
    # Deliberately no `ports:`. The service has no authentication of its own —
    # Caddy is the only way in, and publishing this would publish the document.
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      BIND: 0.0.0.0:8080

volumes:
  caddy-data:
  caddy-config:
