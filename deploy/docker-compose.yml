# Caddy terminates TLS, serves the built static site, and enforces basic auth
# in front of the sync service.
#
# The frontend is built on the developer's machine and rsynced into ./site, so
# the server needs no Node toolchain. The backend is built here from ./backend.
#
# There is no `rauthy` service here yet, so /auth/* answers 502 on this host.
# That is deliberate and currently harmless: basic auth still works, so the app
# never reaches the state where it would offer to sign in. The identity
# provider arrives with the cut-over, along with its secrets and its single
# user — see deploy/compose.local.yml for the shape it will take.

services:
  caddy:
    image: caddy:2-alpine
    container_name: outliner-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    environment:
      # The Caddyfile is shared with the local stack, which runs on a port
      # rather than a hostname. Naming the host here is what makes Caddy get a
      # certificate for it.
      SITE_ADDRESS: outliner.stebel.kim
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The basic_auth credentials, generated by the deploy script. Not
      # committed, and only the bcrypt hash ever reaches the server.
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - ./site:/srv:ro
      # Certificates live here. Losing this volume means re-issuing on every
      # restart, which runs into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: outliner-backend
    restart: unless-stopped
    # Deliberately no `ports:`. The service has no authentication of its own —
    # Caddy is the only way in, and publishing this would publish the document.
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      BIND: 0.0.0.0:8080

volumes:
  caddy-data:
  caddy-config:
