[package]
name = "outliner-sync"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sha2 = "0.10"
httpdate = "1"
# Only used to reject a body that is not syntactically JSON. The service knows
# nothing about the document's shape.
serde_json = "1"

# Bearer token validation. Deliberately small: only Ed25519 is accepted, so
# there is no need for a general JWT library and the algorithm agility that
# comes with it.
ed25519-dalek = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Fetching the provider's public keys. Plain HTTP over the container network,
# so no TLS stack is pulled in, and hyper is already here by way of axum.
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
